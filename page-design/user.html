<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户页面设计 - 知构</title>
    <link rel="stylesheet" href="./common.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./index.html"
          ><span class="brand-mark">知</span
          ><span class="brand-copy"
            ><strong>知构</strong><span>User</span></span
          ></a
        >
        <nav class="nav">
          <a href="./home.html">发现</a><a href="./content.html">文章</a
          ><a class="active" href="./user.html">用户</a
          ><a href="./message-notification.html">消息</a>
        </nav>
        <div class="actions">
          <a class="ghost" href="./index.html">总览</a
          ><button class="button">编辑资料</button>
        </div>
      </header>

      <main class="settings-layout">
        <aside class="side-nav">
          <a class="active" href="#">公开主页</a>
          <a href="#">编辑资料</a>
          <a href="#">关注 / 粉丝</a>
          <a href="#">隐私设置</a>
          <a href="#">拉黑列表</a>
        </aside>

        <section class="panel">
          <div class="section-head">
            <div class="inline-row">
              <span
                class="avatar"
                style="width: 80px; height: 80px; font-size: 28px"
                >陈</span
              >
              <div>
                <h1 class="page-title">陈志峰</h1>
                <p class="hint">
                  构建知识，分享见解。关注内容平台、前端编辑器和微服务架构。
                </p>
              </div>
            </div>
            <div class="actions">
              <button class="button secondary">关注</button
              ><button class="ghost">私信</button>
            </div>
          </div>

          <div class="cards">
            <div class="metric">
              <strong>42</strong><span class="hint">文章</span>
            </div>
            <div class="metric">
              <strong>1.2k</strong><span class="hint">粉丝</span>
            </div>
            <div class="metric">
              <strong>8.6k</strong><span class="hint">获赞</span>
            </div>
          </div>

          <div class="section-head" style="margin-top: 24px">
            <h2 class="section-title">作者文章</h2>
            <div class="tabs">
              <button class="tab selected">文章</button
              ><button class="tab">评论</button
              ><button class="tab">资料</button>
            </div>
          </div>
          <article class="article">
            <div>
              <p class="label">最近发布</p>
              <h2>一次内容详情页降级设计复盘</h2>
              <p>
                公开资料是主资源，关系按钮是附加状态。relation
                加载失败时主页继续展示，操作按钮中性降级。
              </p>
              <div class="chips">
                <span class="chip">用户关系</span><span class="chip">降级</span>
              </div>
            </div>
            <div class="cover"></div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
