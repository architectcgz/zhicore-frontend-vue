<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网关与 ID 页面设计 - 知构</title>
    <link rel="stylesheet" href="./common.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./index.html"
          ><span class="brand-mark">知</span
          ><span class="brand-copy"
            ><strong>知构</strong><span>Gateway / ID</span></span
          ></a
        >
        <nav class="nav">
          <a href="./admin.html">管理</a
          ><a class="active" href="./gateway-id.html">网关</a
          ><a href="./ops.html">运维</a>
        </nav>
        <div class="actions">
          <a class="ghost" href="./index.html">总览</a
          ><button class="button">刷新状态</button>
        </div>
      </header>

      <main class="table-layout">
        <section class="panel">
          <div class="section-head">
            <h1 class="page-title">网关健康</h1>
            <span class="status ok">所有入口可用</span>
          </div>
          <div class="cards">
            <div class="metric">
              <strong>37ms</strong><span class="hint">P95 延迟</span>
            </div>
            <div class="metric">
              <strong>99.2%</strong><span class="hint">成功率</span>
            </div>
            <div class="metric">
              <strong>12</strong><span class="hint">限流命中</span>
            </div>
          </div>
          <div class="section-head" style="margin-top: 24px">
            <h2 class="section-title">请求追踪</h2>
            <input
              class="field"
              style="max-width: 320px"
              value="trace-id / user-id / route"
              aria-label="追踪搜索"
            />
          </div>
          <div class="table">
            <div class="table-row">
              <strong>/api/v1/posts</strong><span>content</span
              ><span class="status ok">200</span><span>32ms</span
              ><button class="ghost">详情</button>
            </div>
            <div class="table-row">
              <strong>/api/v1/posts/engagement</strong><span>content</span
              ><span class="status warn">degraded</span><span>188ms</span
              ><button class="ghost">详情</button>
            </div>
            <div class="table-row">
              <strong>/api/v1/users/me</strong><span>user</span
              ><span class="status ok">200</span><span>21ms</span
              ><button class="ghost">详情</button>
            </div>
          </div>
        </section>

        <aside class="detail-pane">
          <h2 class="section-title">ID 号段</h2>
          <div class="list" style="margin-top: 16px">
            <div class="list-item">
              <strong>content-post</strong
              ><span class="hint">当前段 840000 - 849999</span
              ><span class="status ok">充足</span>
            </div>
            <div class="list-item">
              <strong>comment</strong
              ><span class="hint">当前段 320000 - 329999</span
              ><span class="status ok">充足</span>
            </div>
            <div class="list-item">
              <strong>message</strong
              ><span class="hint">当前段 120000 - 129999</span
              ><span class="status warn">即将补段</span>
            </div>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
