<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文件页面设计 - 知构</title>
    <link rel="stylesheet" href="./common.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./index.html"
          ><span class="brand-mark">知</span
          ><span class="brand-copy"
            ><strong>知构</strong><span>File</span></span
          ></a
        >
        <nav class="nav">
          <a href="./editor.html">编辑器</a
          ><a class="active" href="./file.html">文件</a
          ><a href="./content.html">文章</a>
        </nav>
        <div class="actions">
          <a class="ghost" href="./index.html">总览</a
          ><button class="button">上传文件</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel">
          <div class="section-head">
            <h1 class="page-title">附件库</h1>
            <div class="tabs">
              <button class="tab selected">全部</button
              ><button class="tab">图片</button><button class="tab">封面</button
              ><button class="tab">失败</button>
            </div>
          </div>
          <div class="empty" style="margin-bottom: 18px">
            <div>
              <strong>拖拽文件到这里上传</strong>
              <p class="hint">
                上传成功后返回 fileId；文章正文保存只引用 fileId，不直接保存展示
                URL。
              </p>
              <button class="button secondary">选择文件</button>
            </div>
          </div>
          <div class="cards">
            <div class="card">
              <div class="media-box"></div>
              <h3>cover-content-flow.png</h3>
              <span class="status ok">可用于封面</span>
            </div>
            <div class="card">
              <div class="media-box"></div>
              <h3>editor-preview.webp</h3>
              <span class="status ok">已压缩</span>
            </div>
            <div class="card">
              <div class="media-box"></div>
              <h3>large-image.png</h3>
              <span class="status warn">等待重试</span>
            </div>
          </div>
        </section>

        <aside class="rail">
          <h3>上传状态</h3>
          <div class="list">
            <div class="list-item">
              <strong>大小校验</strong><span class="status ok">通过</span>
            </div>
            <div class="list-item">
              <strong>病毒扫描</strong><span class="status ok">通过</span>
            </div>
            <div class="list-item">
              <strong>派生预览</strong><span class="status warn">排队中</span>
            </div>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
